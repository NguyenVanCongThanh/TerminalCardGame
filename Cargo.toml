[package]
name = "terminal-card-game"
version = "0.1.0"
edition = "2024"
description = "Extensible terminal trading card collecting & pack opening game built with Rust and Ratatui"

[dependencies]
ratatui = "0.30.0"
ratatui-image = { version = "10.0.8", default-features = false, features = ["crossterm", "image-defaults", "tokio", "serde"] }
crossterm = "0.29"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rusqlite = { version = "0.34", features = ["bundled"] }
rand = "0.9"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

